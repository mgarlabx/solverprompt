<!DOCTYPE html>
<html>
<title>Solverprompt</title>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="images/cube.png">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

<head>

    <!-- Google Fonts -->
    <link href="https://fonts.gstatic.com" rel="preconnect">
    <link
        href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i"
        rel="stylesheet">

    <!-- https://github.com/lipis/flag-icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css" />

    <!-- Marked -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- SolverJS -->
    <script src="https://solvertank.tech/solverjs/solverjs.js"></script>
    <link rel="stylesheet" href="https://solvertank.tech/solverjs/solverjs.css">

    <!-- Custom -->
    <script src="script_language.js?v=2"></script>
    <script src="script_prompt.js?v=2"></script>
    <script src="script.js?v=2"></script>
    <link rel="stylesheet" type="text/css" href="style.css?v=2">

</head>

<body>

    <div id="header">
        <div id="header-left">
            <img width="30" src="images/cube.png">&nbsp;&nbsp;&nbsp;
            <div id="header-title">Solverprompt</div>
        </div>
        <div id="header-right">
            <div id="menu-toggle"><i class="fa-solid fa-bars"></i></div>
            <div id="menu-dropdown">
                <div class="menu-item" id="menu-en">
                    <div class="fi fi-us" id="flag-0"></div>&nbsp;&nbsp;English
                </div>
                <div class="menu-item" id="menu-pt">
                    <div class="fi fi-br" id="flag-1"></div>&nbsp;&nbsp;Português
                </div>
                <div class="menu-item" id="menu-es">
                    <div class="fi fi-es" id="flag-2"></div>&nbsp;&nbsp;Castellano
                </div>
                <div class="menu-separator"></div>
                <div class="menu-item" id="menu-terms"><i class="fa-solid fa-file-contract"></i>
                    <div class="menu-caption" id="menu-caption-terms"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="main">
        <div id="prompt">
            <textarea id="prompt-input"></textarea>
        </div>
        <div id="buttons">
            <div class="button" id="button-analyze"></div>
            <div class="button" id="button-submit"></div>
            <div class="button" id="button-clear"></div>
        </div>
        <div id="response"></div>
    </div>

</body>

</html>
